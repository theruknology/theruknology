<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260"><title>theruknology</title><desc>Coral lettering, an animated blue rosette, and geometric shapes on warm ivory.</desc><style>.rosette{transform-origin:990px 130px;animation:turn 40s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.rosette{animation:none}}</style><rect width="1200" height="260" rx="16" fill="#f5f0e6"/><path d="M0 230H1200M60 0V260M780 0V260" stroke="#ddd6ca"/><circle cx="60" cy="230" r="7" fill="#ef6549"/><text x="58" y="142" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" letter-spacing="-5" fill="#e65d42">theruknology</text><text x="64" y="185" font-family="monospace" font-size="18" fill="#55544e">Mohammed Ruknuddin</text><g class="rosette" fill="none" stroke="#536cdc" stroke-width="2"><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(0 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(12 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(24 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(36 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(48 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(60 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(72 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(84 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(96 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(108 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(120 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(132 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(144 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform="rotate(156 990 130)"/><ellipse cx="990" cy="130" rx="112" ry="35" transform